name: Rollout Reusable Workflow Version

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: "Current reusable workflow version"
        required: true
        type: string
        default: "v1.0.0"

      new_version:
        description: "New reusable workflow version"
        required: true
        type: string
        default: "v1.1.0"

      tech_stack:
        description: "Select technology stack"
        required: true
        type: choice
        options:
          - dotnet
          - java
          - node
          - python
          - all

permissions:
  contents: read

jobs:
  rollout:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------
      # Step 1: Display rollout information
      # ---------------------------------------------

      - name: Display rollout information
        run: |
          echo "======================================"
          echo "Reusable Workflow Rollout"
          echo "======================================"
          echo "Tech Stack  : ${{ inputs.tech_stack }}"
          echo "Old Version : ${{ inputs.old_version }}"
          echo "New Version : ${{ inputs.new_version }}"
          echo "======================================"

      # ---------------------------------------------
      # Step 2: Check GitHub CLI
      # ---------------------------------------------

      - name: Check GitHub CLI
        run: |
          gh --version

      # ---------------------------------------------
      # Step 3: Rollout reusable workflow
      # ---------------------------------------------

      - name: Rollout reusable workflow
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          ORG_NAME: arpitjere
          OLD_VERSION: ${{ inputs.old_version }}
          NEW_VERSION: ${{ inputs.new_version }}
          TECH_STACK: ${{ inputs.tech_stack }}

        run: |

          # ==========================================
          # Select repositories based on tech stack
          # ==========================================

          if [ "$TECH_STACK" = "dotnet" ]; then

            WORKFLOW_FILE="dotnet-build.yml"

            REPOS=(
              "test-app"
            )

          elif [ "$TECH_STACK" = "java" ]; then

            WORKFLOW_FILE="java-build.yml"

            REPOS=(
              "java-app-1"
            )

          elif [ "$TECH_STACK" = "node" ]; then

            WORKFLOW_FILE="node-build.yml"

            REPOS=(
              "node-app-1"
            )

          elif [ "$TECH_STACK" = "python" ]; then

            WORKFLOW_FILE="python-build.yml"

            REPOS=(
              "python-app-1"
            )

          elif [ "$TECH_STACK" = "all" ]; then

            REPOS=(
              "test-app"
              "java-app-1"
              "node-app-1"
              "python-app-1"
            )

          else

            echo "Invalid technology stack."
            exit 1

          fi


          # ==========================================
          # Process each repository
          # ==========================================

          for REPO in "${REPOS[@]}"; do

            FULL_REPO="$ORG_NAME/$REPO"

            echo ""
            echo "======================================"
            echo "Processing: $FULL_REPO"
            echo "======================================"


            # ========================================
            # Determine reusable workflow
            # ========================================

            if [ "$TECH_STACK" = "all" ]; then

              case "$REPO" in

                test-app)
                  WORKFLOW_FILE="dotnet-build.yml"
                  ;;

                java-app-1)
                  WORKFLOW_FILE="java-build.yml"
                  ;;

                node-app-1)
                  WORKFLOW_FILE="node-build.yml"
                  ;;

                python-app-1)
                  WORKFLOW_FILE="python-build.yml"
                  ;;

                *)
                  echo "Unknown repository: $REPO"
                  continue
                  ;;

              esac

            fi


            CALLER_FILE=".github/workflows/build.yml"


            # ========================================
            # Check repository access
            # ========================================

            if ! gh repo view "$FULL_REPO" > /dev/null 2>&1; then

              echo "ERROR: Cannot access $FULL_REPO"
              continue

            fi

            echo "Repository access confirmed."


            # ========================================
            # Read caller workflow
            # ========================================

            FILE_DATA=$(gh api \
              "/repos/$FULL_REPO/contents/$CALLER_FILE" \
              2>/dev/null || true)


            if [ -z "$FILE_DATA" ]; then

              echo "Caller workflow not found:"
              echo "$CALLER_FILE"

              continue

            fi


            SHA=$(echo "$FILE_DATA" | jq -r '.sha')


            CONTENT=$(echo "$FILE_DATA" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 -d)


            echo ""
            echo "Current workflow:"
            echo "$CONTENT"


            # ========================================
            # Verify correct reusable workflow
            # ========================================

            REUSABLE_PATH="$ORG_NAME/reusable-workflows-demo/.github/workflows/$WORKFLOW_FILE"


            if ! echo "$CONTENT" | grep -q "$REUSABLE_PATH"; then

              echo "Expected reusable workflow not found."

              echo "Expected:"
              echo "$REUSABLE_PATH"

              continue

            fi


            # ========================================
            # Check old version
            # ========================================

            if ! echo "$CONTENT" | grep -q "@$OLD_VERSION"; then

              echo "Old version @$OLD_VERSION not found."

              continue

            fi


            echo ""
            echo "Old version found: @$OLD_VERSION"


            # ========================================
            # Replace old version with new version
            # ========================================

            UPDATED_CONTENT=$(echo "$CONTENT" \
              | sed "s/@$OLD_VERSION/@$NEW_VERSION/g")


            echo ""
            echo "Updated workflow:"
            echo "$UPDATED_CONTENT"


            # ========================================
            # Encode updated content
            # ========================================

            ENCODED_CONTENT=$(printf '%s' "$UPDATED_CONTENT" \
              | base64 -w 0)


            # ========================================
            # Update GitHub repository
            # ========================================

            echo ""
            echo "Updating $FULL_REPO..."


            gh api \
              --method PUT \
              "/repos/$FULL_REPO/contents/$CALLER_FILE" \
              -f message="chore: update reusable workflow to $NEW_VERSION" \
              -f content="$ENCODED_CONTENT" \
              -f sha="$SHA"


            echo ""
            echo "SUCCESS:"
            echo "$FULL_REPO"
            echo "$CALLER_FILE"
            echo "@$OLD_VERSION -> @$NEW_VERSION"

          done


      # ---------------------------------------------
      # Step 4: Completion
      # ---------------------------------------------

      - name: Rollout completed
        run: |
          echo "======================================"
          echo "Reusable workflow rollout completed"
          echo "======================================"
